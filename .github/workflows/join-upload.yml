# smarTrader19 planner: join a dashboard upload that arrived in pieces (copied to .github/workflows/ by hourly.ship_planner;
# edit the copy in hourly/planner/). GitHub's API refuses one request much over ~30 MB, so the dashboard commits a big
# video as uploads/parts/NAME.partNN (20 MB each) and dispatches this; git itself takes files up to 100 MB, so the
# runner cats the parts into uploads/NAME, drops the parts and pushes. Pages then serves the whole file.
name: join-upload
on:
  workflow_dispatch:
    inputs:
      name:
        description: "file name under uploads/ (the parts are uploads/parts/NAME.partNN)"
        required: true
concurrency:
  group: join-upload
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            uploads
          fetch-depth: 1
      - name: join
        env:
          N: ${{ inputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$N" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad name: $N"; exit 1; }
          ls uploads/parts/"$N".part* > /dev/null
          cat $(ls uploads/parts/"$N".part* | sort) > uploads/"$N"
          ls -l uploads/"$N"
          git rm -q uploads/parts/"$N".part*
          git add uploads/"$N"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -q -m "join upload $N"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
